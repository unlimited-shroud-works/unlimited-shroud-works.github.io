<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unlimited Shroud Works</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .main {
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(28px, 7vw, 56px);
      letter-spacing: 2px;
    }

    .sub {
      color: #aaa;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      margin-top: 30px;
      padding: 8px 14px;
      border: 1px solid #39ff14;
      color: #39ff14;
      font-family: monospace;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: 1;
      }

      90% {
        opacity: 0.35;
      }
    }

    footer {
      margin-top: 50px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="main">

    <h1>Unlimited Shroud Works</h1>

    <div class="sub">
      Yuuki's Personal Platform
    </div>

    <div class="status">
      ● NOW BUILDING...
    </div>

    <footer>
      Since 2026
    </footer>

  </main>

</body>
</html>
